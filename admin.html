<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Üzük.Baku — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login" id="loginBox">
  <h1>Üzük.Baku admin</h1>
  <label for="em">E-poçt</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Şifrə</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="loginBtn" style="margin-top:18px;width:100%;justify-content:center">Daxil ol</button>
  <p id="loginErr" style="color:var(--red);margin-top:12px;font-size:.9rem"></p>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <a class="brand" href="index.html">Üzük.Baku<i></i></a>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="counter" id="count"></span>
      <a class="btn ghost sm" href="index.html" target="_blank">Sayta bax</a>
      <button class="btn ghost sm" id="logout">Çıxış</button>
    </div>
  </header>

  <div class="quota" id="quota"></div>

  <div class="layout">
    <section class="panel">
      <h2 style="margin-bottom:6px">Yeni məhsul</h2>
      <label>Şəkil</label>
      <label class="drop" for="file" id="drop"><span>Şəkil seçmək üçün toxunun</span></label>
      <input id="file" type="file" accept="image/*" hidden>
      <label for="name">Ad</label><input id="name" maxlength="60">
      <label for="cat">Kateqoriya (istəyə bağlı)</label>
      <input id="cat" list="cats" maxlength="30" placeholder="məs. Üzük">
      <datalist id="cats"><option value="Üzük"><option value="Sırğa"><option value="Boyunbağı"><option value="Bilərzik"><option value="Saat"><option value="Çanta"><option value="Eynək"><option value="Telefon qabı"></datalist>
      <div class="two">
        <div><label for="price">Qiymət</label><input id="price" type="number" min="0" step="0.01"></div>
        <div><label for="stock">Stok (ədəd)</label><input id="stock" type="number" min="0" step="1"></div>
      </div>
      <label for="desc">Qısa təsvir (istəyə bağlı)</label><textarea id="desc" maxlength="140"></textarea>
      <button class="btn" id="add" style="margin-top:18px;width:100%;justify-content:center">Məhsulu əlavə et</button>
    </section>

    <section class="panel">
      <h2 style="margin-bottom:6px">Mövcud məhsullar</h2>
      <div id="list"><p style="color:var(--mute)">Yüklənir…</p></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig, ADMIN_EMAIL, MAX_PRODUCTS, CLOUD_NAME, UPLOAD_PRESET } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const ref = doc(db, "shop", "catalog");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thumb = (u, w) => u.replace("/upload/", `/upload/f_auto,q_auto,w_${w}/`);
const MSG_COUNT = `${MAX_PRODUCTS} məhsul limiti dolub. Bir məhsulu silib yenidən sınayın.`;
const MSG_UPLOAD = "Şəkil yüklənmədi. Şəkil yaddaşı (Cloudinary) kotası dolmuş ola bilər: Cloudinary hesabında Usage bölməsinə baxın. Bir məhsulu silib yenidən sınayın.";
let imageBlob = null, itemCount = 0;

function toast(msg, err){
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  setTimeout(() => t.className = "toast", 3200);
}
function showQuota(msg){
  const q = $("quota"); q.textContent = msg; q.classList.add("show");
  q.classList.remove("shake"); void q.offsetWidth; q.classList.add("shake");
  window.scrollTo({ top: 0, behavior: "smooth" }); toast(msg, true);
}

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch { $("loginErr").textContent = "E-poçt və ya şifrə yanlışdır."; }
};
$("logout").onclick = () => signOut(auth);
onAuthStateChanged(auth, user => {
  if (user && user.email === ADMIN_EMAIL){ $("loginBox").hidden = true; $("app").hidden = false; loadList(); }
  else {
    if (user){ signOut(auth); $("loginErr").textContent = "Bu hesabın admin icazəsi yoxdur."; }
    $("loginBox").hidden = false; $("app").hidden = true;
  }
});

async function getItems(){ const s = await getDoc(ref); return s.exists() ? (s.data().items || []) : []; }
async function mutate(fn){
  return runTransaction(db, async tx => {
    const s = await tx.get(ref);
    const next = fn(s.exists() ? (s.data().items || []) : []);
    tx.set(ref, { items: next, updatedAt: Date.now() });
    try { localStorage.removeItem("uzuk_catalog_v1"); } catch {}
    return next;
  });
}

$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1200 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => { imageBlob = b; $("drop").innerHTML = `<img src="${URL.createObjectURL(b)}" alt="Önizləmə">`; }, "image/jpeg", .85);
  };
  img.src = URL.createObjectURL(f);
};
async function uploadImage(blob){
  const fd = new FormData(); fd.append("file", blob); fd.append("upload_preset", UPLOAD_PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
  if (!r.ok) throw new Error("UPLOAD");
  return (await r.json()).secure_url;
}

async function loadList(){
  const items = (await getItems()).slice().sort((a, b) => b.createdAt - a.createdAt);
  itemCount = items.length;
  $("count").textContent = MAX_PRODUCTS ? `${itemCount}/${MAX_PRODUCTS}` : `${itemCount} məhsul`;
  if (MAX_PRODUCTS && itemCount >= MAX_PRODUCTS) showQuota(MSG_COUNT); else $("quota").classList.remove("show");
  $("list").innerHTML = items.length ? items.map(p => `
    <div class="item" data-id="${p.id}">
      <img src="${thumb(p.image, 150)}" alt="">
      <div><strong>${esc(p.name)}</strong>${p.category ? `<div style="color:var(--mute);font-size:.85rem">${esc(p.category)}</div>` : ""}
        <div class="edit">
          <input type="number" min="0" step="0.01" value="${p.price}" data-f="price" aria-label="Qiymət">
          <input type="number" min="0" step="1" value="${p.stock}" data-f="stock" aria-label="Stok">
          <button class="btn sm ghost" data-act="save">Yadda saxla</button>
        </div></div>
      <button class="btn sm danger" data-act="del">Sil</button>
    </div>`).join("") : '<p style="color:var(--mute)">Hələlik məhsul yoxdur. Soldakı formadan ilk məhsulu əlavə edin.</p>';
}
$("list").onclick = async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const row = b.closest(".item"), id = row.dataset.id;
  try {
    if (b.dataset.act === "del"){
      if (!confirm("Bu məhsul silinsin?")) return;
      await mutate(a => a.filter(x => x.id !== id)); toast("Silindi"); loadList();
    } else {
      const price = parseFloat(row.querySelector('[data-f="price"]').value);
      const stock = parseInt(row.querySelector('[data-f="stock"]').value, 10);
      if (isNaN(price) || isNaN(stock)) return toast("Qiymət və stoku düzgün yazın", true);
      await mutate(a => a.map(x => x.id === id ? { ...x, price, stock } : x)); toast("Yadda saxlanıldı");
    }
  } catch (err) { console.error(err); toast("Xəta baş verdi", true); }
};

$("add").onclick = async () => {
  const name = $("name").value.trim(), price = parseFloat($("price").value), stock = parseInt($("stock").value, 10);
  if (!imageBlob) return toast("Şəkil seçin", true);
  if (!name || isNaN(price) || isNaN(stock)) return toast("Ad, qiymət və stoku doldurun", true);
  if (MAX_PRODUCTS && itemCount >= MAX_PRODUCTS) return showQuota(MSG_COUNT);

  $("add").disabled = true;
  try {
    const image = await uploadImage(imageBlob);
    await mutate(a => [...a, { id: crypto.randomUUID(), name, category: $("cat").value.trim(), price, stock, desc: $("desc").value.trim(), image, createdAt: Date.now() }]);
    imageBlob = null; ["name","cat","price","stock","desc","file"].forEach(i => $(i).value = "");
    $("drop").innerHTML = "<span>Şəkil seçmək üçün toxunun</span>";
    toast("Məhsul əlavə olundu"); await loadList();
  } catch (e) {
    console.error(e);
    if (e.message === "UPLOAD") showQuota(MSG_UPLOAD);
    else if (e.code === "resource-exhausted") showQuota("Firebase gündəlik limiti dolub. Bir qədər sonra yenidən sınayın.");
    else toast("Xəta: əlavə edilmədi", true);
  } finally { $("add").disabled = false; }
};
</script>
</body>
</html>
